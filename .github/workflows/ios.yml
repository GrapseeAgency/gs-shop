name: iOS

on:
  push:
    branches: [main, master]
    paths:
      - "grapsee-ios/**"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "grapsee-ios/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: grapsee-ios
    steps:
      - uses: actions/checkout@v6

      - name: Select Xcode 16
        run: sudo xcode-select -s /Applications/Xcode_16*.app/Contents/Developer || sudo xcode-select -p

      - name: Build (unsigned validation)
        # No signing identity on CI: CODE_SIGNING_ALLOWED=NO validates that
        # every Swift file compiles. Signed IPAs are produced by release.yml
        # when APPLE_* secrets are present.
        run: |
          xcodebuild -project GrapseeShop.xcodeproj -scheme GrapseeShop \
            -sdk iphoneos -configuration Release \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            -derivedDataPath build | tail -5

      - name: Upload unsigned app
        uses: actions/upload-artifact@v4
        with:
          name: ios-app-unsigned
          path: grapsee-ios/build/Build/Products/Release-iphoneos/GrapseeShop.app
          if-no-files-found: warn
