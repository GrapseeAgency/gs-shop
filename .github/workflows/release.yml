name: Release

# Tag a version (e.g. v1.1.0) and push the tag:
#   git tag v1.1.0 && git push origin v1.1.0
# Both apps are stamped with the tag, built, and published to one
# GitHub Release. Phones pick it up through the in-app updater.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to release (e.g. v1.1.0)"
        required: true

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Resolve version
        id: ver
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "name=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Stamp Android version
        working-directory: grapsee-android
        run: |
          sed -i 's/versionCode = .*/versionCode = ${{ github.run_number }}/' app/build.gradle.kts
          sed -i 's/versionName = ".*"/versionName = "${{ steps.ver.outputs.name }}"/' app/build.gradle.kts
          grep -n "versionCode\|versionName" app/build.gradle.kts | head -4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Restore release keystore (preferred) or use repo keystore
        working-directory: grapsee-android
        run: |
          if [ -n "${{ secrets.GRAPSEE_KEYSTORE_B64 }}" ]; then
            echo "${{ secrets.GRAPSEE_KEYSTORE_B64 }}" | base64 -d > grapsee-release.jks
            echo "keystore from secrets"
          else
            echo "keystore from repo (rotate it: see RELEASE.md)"
          fi

      - name: Build signed release APK
        working-directory: grapsee-android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --console=plain \
            -PapiUrl="${{ vars.PROD_API_URL }}" \
            -PwebUrl="${{ vars.PROD_WEB_URL }}" \
            -PupdateOwner="${{ github.repository_owner }}" \
            -PupdateRepo="${{ github.event.repository.name }}"
        env:
          GRAPSEE_STORE_PASS: ${{ secrets.GRAPSEE_STORE_PASS }}
          GRAPSEE_KEY_PASS: ${{ secrets.GRAPSEE_KEY_PASS }}

      - name: Rename APK
        run: cp grapsee-android/app/build/outputs/apk/release/app-release.apk GrapseeShop-${{ steps.ver.outputs.tag }}.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: GrapseeShop-*.apk

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6

      - name: Resolve version
        id: ver
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "name=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Stamp iOS version
        working-directory: grapsee-ios
        run: |
          sed -i '' 's/MARKETING_VERSION = .*/MARKETING_VERSION = ${{ steps.ver.outputs.name }};/' GrapseeShop.xcodeproj/project.pbxproj
          sed -i '' "s/CURRENT_PROJECT_VERSION = .*/CURRENT_PROJECT_VERSION = ${{ github.run_number }};/" GrapseeShop.xcodeproj/project.pbxproj
          sed -i '' 's|static let owner = ".*"|static let owner = "${{ github.repository_owner }}"|' GrapseeShop/Core/UpdateChecker.swift
          sed -i '' 's|static let repo = ".*"|static let repo = "${{ github.event.repository.name }}"|' GrapseeShop/Core/UpdateChecker.swift

      - name: Select Xcode 16
        run: sudo xcode-select -s /Applications/Xcode_16*.app/Contents/Developer || sudo xcode-select -p

      - name: Build unsigned IPA contents (validation)
        working-directory: grapsee-ios
        run: |
          xcodebuild -project GrapseeShop.xcodeproj -scheme GrapseeShop \
            -sdk iphoneos -configuration Release \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            -derivedDataPath build | tail -3
          cd build/Build/Products/Release-iphoneos
          mkdir -p Payload && cp -r GrapseeShop.app Payload/
          zip -r ../../../../GrapseeShop-${{ steps.ver.outputs.tag }}-unsigned.ipa Payload

      - name: Signed export (only with Apple secrets)
        if: ${{ secrets.APPLE_TEAM_ID != '' }}
        working-directory: grapsee-ios
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
        run: |
          echo "${{ secrets.APPLE_DIST_P12_B64 }}" | base64 -d > dist.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import dist.p12 -k build.keychain -P "${{ secrets.APPLE_DIST_P12_PASSWORD }}" -T /usr/bin/codesign
          cat > ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>ad-hoc</string>
            <key>teamID</key><string>${{ secrets.APPLE_TEAM_ID }}</string>
          </dict></plist>
          EOF
          xcodebuild -project GrapseeShop.xcodeproj -scheme GrapseeShop \
            -sdk iphoneos -configuration Release -archivePath build/GrapseeShop.xcarchive archive \
            DEVELOPMENT_TEAM=${{ secrets.APPLE_TEAM_ID }}
          xcodebuild -exportArchive -archivePath build/GrapseeShop.xcarchive \
            -exportPath build/export -exportOptionsPlist ExportOptions.plist
          cp build/export/GrapseeShop.ipa ../GrapseeShop-${{ steps.ver.outputs.tag }}.ipa

      - name: Upload iOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-release
          path: grapsee-ios/GrapseeShop-*.ipa
          if-no-files-found: warn

  publish:
    needs: [android, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-apk

      - uses: actions/download-artifact@v4
        with:
          name: ios-release
        continue-on-error: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            GrapseeShop-*.apk
            GrapseeShop-*.ipa
